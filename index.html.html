<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Besti <3</title>

<style>

/* =========================
   ОСНОВА
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =========================
   СТРАНИЦЫ
========================= */

.page {
    position: absolute;

    width: 100%;
    height: 100%;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    text-align: center;
}

.active {
    display: flex;
}


/* =========================
   ПЕРВАЯ СТРАНИЦА
========================= */

#page1 {
    background: #f7c6d8;
    color: #3b1724;
}

#page1 h1 {
    font-size: 45px;
    font-weight: 500;

    margin-bottom: 60px;
}


/* =========================
   ЧЁРНЫЕ СТРАНИЦЫ
========================= */

.black {
    background: #000;
    color: white;
}


/* =========================
   КНОПКИ
========================= */

button {
    border: none;

    border-radius: 30px;

    padding: 13px 35px;

    font-size: 18px;

    cursor: pointer;

    transition: 0.25s;

    margin-top: 25px;
}

button:hover {
    transform: scale(1.08);
}

.pinkButton {
    background: #ff79a2;
    color: white;
}

.whiteButton {
    background: white;
    color: black;
}


/* Кнопка внизу */

.bottom {
    position: absolute;

    bottom: 35px;

    z-index: 100;
}


/* =========================
   BEATRISE
========================= */

#beatrisewords {
    position: absolute;

    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.name {
    position: absolute;

    color: white;

    font-size: 20px;

    opacity: 0;

    animation: appear 1.5s forwards;

    filter: blur(0.5px);
}

@keyframes appear {

    0% {
        opacity: 0;

        transform: scale(0.5);

        filter: blur(8px);
    }

    100% {
        opacity: 0.85;

        transform: scale(1);

        filter: blur(0);
    }
}


/* =========================
   БОЛЬШИЕ СМАЙЛИКИ
========================= */

.big {
    font-size: 150px;

    margin-bottom: 40px;
}

.text {
    font-size: 28px;

    max-width: 90%;

    line-height: 1.4;
}


/* =========================
   ФИНАЛЬНЫЙ ЭКРАН
========================= */

#finalPage {
    background: #000;

    overflow: hidden;
}


/* =========================
   СЕРДЦЕ
========================= */

#heart {
    position: absolute;

    width: 700px;
    height: 600px;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    z-index: 10;

    pointer-events: none;
}

.heartWord {
    position: absolute;

    color: #ff719f;

    font-size: 17px;

    font-weight: bold;

    text-shadow:
        0 0 5px #ff719f,
        0 0 12px #ff4f8d,
        0 0 25px #ff4f8d,
        0 0 40px #ff2f78;

    filter: blur(0.8px);

    opacity: 0;

    transition:
        left 2.2s ease,
        top 2.2s ease,
        opacity 1.5s ease,
        transform 2.2s ease;
}


/* =========================
   ЛЕТАЮЩИЕ СМАЙЛИКИ
========================= */

#floatingEmojis {
    position: absolute;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 5;
}

.floating {
    position: absolute;

    font-size: 20px;

    opacity: 0.85;

    filter: blur(0.3px);

    animation:
        floatAround linear infinite;
}


/* Движение смайликов */

@keyframes floatAround {

    0% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }

    25% {
        transform:
            translate(35px, -50px)
            rotate(15deg);
    }

    50% {
        transform:
            translate(-35px, -90px)
            rotate(-15deg);
    }

    75% {
        transform:
            translate(45px, -40px)
            rotate(10deg);
    }

    100% {
        transform:
            translate(0, 0)
            rotate(0deg);
    }
}

</style>

</head>


<body>


<!-- =================================================
     ПЕРВАЯ СТРАНИЦА
================================================= -->

<section class="page active" id="page1">

    <h1>
        for My besti&lt;3
    </h1>

    <button
        class="pinkButton"
        onclick="showPage(2)"
    >
        uspied
    </button>

</section>



<!-- =================================================
     ВТОРАЯ СТРАНИЦА
================================================= -->

<section class="page black" id="page2">

    <div id="beatrisewords"></div>

    <button
        class="whiteButton bottom"
        onclick="showPage(3)"
    >
        Continue
    </button>

</section>



<!-- =================================================
     ТРЕТЬЯ СТРАНИЦА
================================================= -->

<section class="page black" id="page3">

    <div class="big">
        🖕
    </div>

    <div class="text">
        There's nothing left here,
        so why are you pressing it?
    </div>

    <button
        class="whiteButton bottom"
        onclick="showPage(4)"
    >
        Press again
    </button>

</section>



<!-- =================================================
     ЧЕТВЁРТАЯ СТРАНИЦА
================================================= -->

<section class="page black" id="page4">

    <div class="big">
        🫵🤡🤣
    </div>

    <div class="text">
        idiot
    </div>

    <button
        class="whiteButton bottom"
        onclick="showPage(5)"
    >
        Again
    </button>

</section>



<!-- =================================================
     ПЯТАЯ СТРАНИЦА
================================================= -->

<section class="page black" id="page5">

    <div class="big">
        😑🤨
    </div>

    <div class="text">
        okay, fine. Press again
    </div>

    <button
        class="whiteButton bottom"
        onclick="showPage(6)"
    >
        Press
    </button>

</section>



<!-- =================================================
     ФИНАЛ
================================================= -->

<section class="page black" id="finalPage">

    <!-- Сюда будет создано сердце -->

    <div id="heart"></div>


    <!-- Сюда будут созданы смайлики -->

    <div id="floatingEmojis"></div>

</section>



<script>


/* =================================================
   ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
================================================= */

function showPage(number) {

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove("active");

        });


    /* Вторая страница */

    if (number === 2) {

        document
            .getElementById("page2")
            .classList.add("active");

        createBeatrise();
    }


    /* Обычные страницы */

    else if (number !== 6) {

        document
            .getElementById("page" + number)
            .classList.add("active");
    }


    /* Финальная страница */

    else {

        document
            .getElementById("finalPage")
            .classList.add("active");

        createFloatingEmojis();

        createHeart();
    }

}



/* =================================================
   BEATRISE
================================================= */

function createBeatrise() {

    const container =
        document.getElementById("beatrisewords");

    container.innerHTML = "";


    /* Количество Beatrise */

    for (let i = 0; i < 55; i++) {

        const word =
            document.createElement("span");


        word.className = "name";

        word.textContent = "Beatrise";


        /* Случайное место */

        word.style.left =
            Math.random() * 95 + "%";

        word.style.top =
            Math.random() * 90 + "%";


        /* Разный размер */

        word.style.fontSize =
            (14 + Math.random() * 25) + "px";


        /* Разная задержка */

        word.style.animationDelay =
            Math.random() * 2 + "s";


        container.appendChild(word);
    }

}



/* =================================================
   СОЗДАНИЕ СЕРДЦА
================================================= */

function createHeart() {

    const heart =
        document.getElementById("heart");

    heart.innerHTML = "";


    /*
       Слова, из которых
       будет состоять сердце
    */

    const words = [

        "Beatrise",
        "bestie",
        "love",
        "Beatrise",
        "bestie",
        "forever",
        "Beatrise",
        "bestie",
        "love"

    ];


    /*
       Чем больше число,
       тем плотнее сердце
    */

    const amount = 280;


    for (let i = 0; i < amount; i++) {

        const word =
            document.createElement("span");


        word.className =
            "heartWord";


        word.textContent =
            words[i % words.length];


        heart.appendChild(word);


        /*
           Положение на математическом сердце
        */

        const t =
            (Math.PI * 2 * i) / amount;


        const x =
            16 * Math.pow(Math.sin(t), 3);


        const y =
            -(
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t)
            );


        /*
           Немного случайности,
           чтобы сердце не было
           слишком идеально ровным
        */

        const finalX =
            x * 19 +
            (Math.random() - 0.5) * 18;


        const finalY =
            y * 19 +
            (Math.random() - 0.5) * 18;


        /*
           Начальная позиция.
           Слова сначала находятся
           далеко от сердца.
        */

        const startX =
            (Math.random() - 0.5) * 1100;


        const startY =
            (Math.random() - 0.5) * 900;


        word.style.left =
            `calc(50% + ${startX}px)`;


        word.style.top =
            `calc(50% + ${startY}px)`;


        word.style.transform =
            `translate(-50%, -50%)
             rotate(${Math.random() * 360}deg)`;


        /*
           Слова постепенно
           прилетают на своё место
        */

        setTimeout(() => {

            word.style.opacity = 0.75;


            word.style.left =
                `calc(50% + ${finalX}px)`;


            word.style.top =
                `calc(50% + ${finalY}px)`;


            word.style.transform =
                `translate(-50%, -50%)
                 rotate(${Math.random() * 20 - 10}deg)`;


        }, i * 10);

    }

}



/* =================================================
   СОЗДАНИЕ МНОЖЕСТВА СМАЙЛИКОВ
================================================= */

function createFloatingEmojis() {

    const container =
        document.getElementById("floatingEmojis");

    container.innerHTML = "";


    /*
       Сердечки и ручки встречаются чаще,
       клоуны немного реже.
    */

    const emojis = [

        "❤",
        "❤",
        "❤",
        "❤",
        "❤",

        "🫶",
        "🫶",
        "🫶",
        "🫶",

        "💙",
        "💙",
        "💙",

        "🤡",
        "🤡"

    ];


    /*
       150 смайликов
    */

    for (let i = 0; i < 150; i++) {

        const emoji =
            document.createElement("span");


        emoji.className =
            "floating";


        /*
           Выбираем случайный смайлик
        */

        emoji.textContent =
            emojis[
                Math.floor(
                    Math.random() * emojis.length
                )
            ];


        /*
           Случайное место
           по всему экрану
        */

        emoji.style.left =
            Math.random() * 100 + "%";

        emoji.style.top =
            Math.random() * 100 + "%";


        /*
           Разный размер
        */

        emoji.style.fontSize =
            (12 + Math.random() * 22) + "px";


        /*
           Разная скорость
        */

        emoji.style.animationDuration =
            (4 + Math.random() * 8) + "s";


        /*
           Некоторые уже находятся
           в середине своей анимации
        */

        emoji.style.animationDelay =
            (-Math.random() * 8) + "s";


        container.appendChild(emoji);

    }

}

</script>

</body>

</html>
